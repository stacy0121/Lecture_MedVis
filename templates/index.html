<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>욕창 예방 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#F5F4F0;--surface:#FFFFFF;--surface2:#F0EFE9;
  --border:#E2E0D8;--border2:#D0CEC4;
  --txt-primary:#1A1916;--txt-secondary:#6B6960;--txt-tertiary:#9B9A93;
  --red:#C0392B;--red-light:#FCECEA;--red-mid:#F4A59A;
  --amber:#9A5E00;--amber-light:#FDF3E3;--amber-mid:#F0C070;
  --green:#2D6A2D;--green-light:#EAF4E8;--green-mid:#82C082;
  --blue:#1A56A0;--blue-light:#E8F1FC;
  --r-sm:6px;--r-md:10px;--r-lg:14px;
  --sh-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --sh-md:0 4px 12px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.05);
  --font:\'Noto Sans KR\',sans-serif;--mono:\'DM Mono\',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px;-webkit-font-smoothing:antialiased}
body{font-family:var(--font);background:var(--bg);color:var(--txt-primary);min-height:100vh}
#app{max-width:680px;margin:0 auto;padding:0 16px 40px}

/* 헤더 */
.header{display:flex;align-items:center;justify-content:space-between;padding:20px 0 16px;border-bottom:1px solid var(--border);margin-bottom:20px;gap:12px}
.header-left{display:flex;align-items:center;gap:10px}
.header-icon{width:36px;height:36px;background:var(--txt-primary);border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;flex-shrink:0}
.header-title{font-size:15px;font-weight:700;letter-spacing:-.3px}
.header-sub{font-size:11px;color:var(--txt-tertiary);margin-top:1px}
.refresh-badge{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--txt-tertiary);font-family:var(--mono)}
.refresh-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
.refresh-dot.loading{background:var(--amber);animation:spin-dot 1s linear infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin-dot{0%{transform:scale(1)}50%{transform:scale(1.4)}100%{transform:scale(1)}}

/* 통계 카드 */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--sh-sm);transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r-lg) var(--r-lg) 0 0}
.stat-card.red::before{background:var(--red)}.stat-card.amber::before{background:var(--amber)}.stat-card.green::before{background:var(--green)}
.stat-card:hover{transform:translateY(-1px);box-shadow:var(--sh-md)}
.stat-icon{font-size:18px;margin-bottom:6px}
.stat-label{font-size:11px;color:var(--txt-secondary);font-weight:500;margin-bottom:4px}
.stat-val{font-size:26px;font-weight:700;font-family:var(--mono)}
.stat-val.red{color:var(--red)}.stat-val.amber{color:var(--amber)}.stat-val.green{color:var(--green)}

/* 섹션 레이블 */
.section-label{font-size:11px;font-weight:600;color:var(--txt-tertiary);letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px}

/* 환자 카드 */
.p-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:8px;box-shadow:var(--sh-sm);overflow:hidden;transition:box-shadow .15s}
.p-card:hover{box-shadow:var(--sh-md)}
.p-card.immediate{border-left:3px solid var(--red)}.p-card.caution{border-left:3px solid var(--amber)}.p-card.stable{border-left:3px solid var(--green-mid)}
.p-card-header{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none}
.p-card-header:hover{background:var(--surface2)}
.rank-badge{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;font-family:var(--mono)}
.rank-badge.red{background:var(--red-light);color:var(--red)}.rank-badge.amber{background:var(--amber-light);color:var(--amber)}.rank-badge.green{background:var(--green-light);color:var(--green)}
.p-info{flex:1;min-width:0}
.p-name{font-size:13px;font-weight:600}
.p-meta{font-size:11px;color:var(--txt-tertiary);margin-top:1px}
.status-pill{font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0;letter-spacing:.2px}
.status-pill.red{background:var(--red-light);color:var(--red)}.status-pill.amber{background:var(--amber-light);color:var(--amber)}.status-pill.green{background:var(--green-light);color:var(--green)}
.posture-flow{display:flex;align-items:center;gap:5px;flex-shrink:0}
.p-chip{font-size:10px;font-weight:600;padding:3px 7px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface2);color:var(--txt-secondary);white-space:nowrap}
.p-chip.next-ok{background:var(--green-light);color:var(--green);border-color:var(--green-mid)}
.p-chip.next-urg{background:var(--red-light);color:var(--red);border-color:var(--red-mid)}
.arrow-icon{font-size:10px;color:var(--txt-tertiary)}
.score-badge{font-size:13px;font-weight:700;font-family:var(--mono);width:36px;text-align:right;flex-shrink:0}
.score-badge.red{color:var(--red)}.score-badge.amber{color:var(--amber)}.score-badge.green{color:var(--green)}
.detail-btn{font-size:10px;padding:4px 9px;border:1px solid var(--border2);border-radius:var(--r-sm);background:transparent;color:var(--txt-secondary);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:background .12s,color .12s}
.detail-btn:hover{background:var(--surface2);color:var(--txt-primary)}
.risk-bar-track{height:2px;background:var(--surface2)}
.risk-bar-fill{height:2px;transition:width .4s ease}

/* 인라인 패널 */
.inline-panel{border-top:1px solid var(--border);padding:12px 14px;display:none;background:var(--bg);animation:slideDown .15s ease}
@keyframes slideDown{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.hm-label{display:flex;justify-content:space-between;font-size:10px;color:var(--txt-tertiary);margin-bottom:5px}
.hm-grid{display:flex;gap:2px;height:28px;border-radius:var(--r-sm);overflow:hidden}
.hm-cell{flex:1}
.hm-legend{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
.hm-leg-item{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--txt-tertiary)}
.hm-leg-swatch{width:20px;height:6px;border-radius:2px}
.inline-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ig-item{font-size:11px;color:var(--txt-secondary)}
.ig-val{font-size:12px;font-weight:600;color:var(--txt-primary);margin-top:2px}
.action-box{margin-top:10px;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);font-size:12px;font-weight:500;display:flex;align-items:center;gap:7px}
.action-box.urgent{border-color:var(--red-mid);background:var(--red-light);color:var(--red)}
.action-box.caution{border-color:var(--amber-mid);background:var(--amber-light);color:var(--amber)}

/* 상세 페이지 */
#detail-view{display:none}
.detail-nav{display:flex;align-items:center;gap:10px;padding:16px 0 14px;border-bottom:1px solid var(--border);margin-bottom:16px}
.back-btn{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--txt-secondary);background:none;border:none;cursor:pointer;padding:0;transition:color .12s}
.back-btn:hover{color:var(--txt-primary)}
.detail-nav-title{font-size:14px;font-weight:600}
.dp-header{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;box-shadow:var(--sh-sm)}
.dp-hrow{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.dp-avatar{width:46px;height:46px;border-radius:50%;background:var(--blue-light);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.dp-name{font-size:16px;font-weight:700}
.dp-sub{font-size:11px;color:var(--txt-secondary);margin-top:3px;line-height:1.5}
.dp-sub span{color:var(--txt-tertiary)}
.dp-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dp-metric{background:var(--surface2);border-radius:var(--r-md);padding:10px 12px}
.dp-metric-lbl{font-size:10px;color:var(--txt-tertiary);font-weight:500;margin-bottom:4px}
.dp-metric-val{font-size:16px;font-weight:700;font-family:var(--mono)}
.dp-metric-val.blue{color:var(--blue)}.dp-metric-val.danger{color:var(--red)}.dp-metric-val.amber{color:var(--amber)}.dp-metric-val.ok{color:var(--green)}
.dp-metric-sub{font-size:10px;color:var(--txt-tertiary);margin-top:2px}
.dp-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;box-shadow:var(--sh-sm)}
.dp-sec-title{font-size:12px;font-weight:700;color:var(--txt-secondary);letter-spacing:.5px;text-transform:uppercase;margin-bottom:14px}
.dp-two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.factor-row{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:11px}
.factor-name{width:66px;color:var(--txt-secondary);flex-shrink:0;line-height:1.3}
.factor-track{flex:1;height:7px;background:var(--surface2);border-radius:4px;overflow:hidden}
.factor-fill{height:7px;border-radius:4px;transition:width .5s ease}
.factor-score{width:26px;text-align:right;font-weight:700;font-family:var(--mono);font-size:11px}
.factor-legend{display:flex;gap:12px;font-size:10px;color:var(--txt-tertiary);margin-top:6px}
.body-map-row{display:flex;gap:16px;align-items:flex-start}
.body-map-svg{flex:1;min-width:0}
.body-map-legend{flex-shrink:0;width:110px}
.bleg-title{font-size:11px;font-weight:700;color:var(--txt-secondary);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px}
.bleg-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--txt-secondary);margin-bottom:7px}
.bleg-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.bleg-spots-title{font-size:11px;font-weight:700;color:var(--txt-secondary);text-transform:uppercase;letter-spacing:.4px;margin:14px 0 8px}
.bleg-spot{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--txt-secondary);margin-bottom:5px}
.bleg-spot-dot{width:7px;height:7px;border-radius:50%;background:var(--red);flex-shrink:0}
.tl-wrap{overflow-x:auto;padding-bottom:4px}
.tl-row{display:flex;align-items:flex-start}
.tl-cell{flex:1;min-width:64px;text-align:center}
.tl-chip{display:inline-block;padding:4px 8px;border-radius:var(--r-sm);font-size:10px;font-weight:600;margin-bottom:6px;white-space:nowrap}
.tl-chip.left{background:var(--blue-light);color:var(--blue)}.tl-chip.right{background:var(--green-light);color:var(--green)}.tl-chip.supine{background:var(--amber-light);color:var(--amber)}
.tl-line-row{display:flex;align-items:center;height:18px}
.tl-dot{width:9px;height:9px;border-radius:50%;background:var(--border2);flex-shrink:0;margin:0 auto}
.tl-dot.active{background:var(--red);box-shadow:0 0 0 3px var(--red-light)}
.tl-seg{flex:1;height:2px;background:var(--border)}.tl-seg.danger{background:var(--red)}
.tl-time{font-size:10px;color:var(--txt-tertiary);margin-top:5px;font-family:var(--mono)}
.alert-box{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);border:1px solid;margin-top:12px;font-size:12px;line-height:1.5}
.alert-box.danger{background:var(--red-light);border-color:var(--red-mid);color:var(--red)}
.alert-box.warn{background:var(--amber-light);border-color:var(--amber-mid);color:var(--amber)}
.alert-icon{font-size:16px;flex-shrink:0}
.skeleton-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;margin-bottom:8px;animation:shimmer 1.4s infinite}
.sk-line{height:10px;background:var(--surface2);border-radius:4px;margin-bottom:8px}
.sk-line.short{width:40%}.sk-line.mid{width:65%}
@keyframes shimmer{0%,100%{opacity:1}50%{opacity:.5}}
@media(max-width:480px){.dp-metrics{grid-template-columns:repeat(2,1fr)}.dp-two-col{grid-template-columns:1fr}.posture-flow{display:none}.stat-val{font-size:22px}}
</style>
</head>
<body>
<div id="app">
  <div id="list-view">
    <header class="header">
      <div class="header-left">
        <div class="header-icon">🏥</div>
        <div>
          <div class="header-title">욕창 예방 대시보드</div>
          <div class="header-sub" id="ward-label">3병동 · 로딩 중...</div>
        </div>
      </div>
      <div class="refresh-badge">
        <div class="refresh-dot" id="refresh-dot"></div>
        <span id="refresh-time">—</span>
      </div>
    </header>
    <div class="stat-grid">
      <div class="stat-card red"><div class="stat-icon">🚨</div><div class="stat-label">즉시 조치</div><div class="stat-val red" id="cnt-immediate">—</div></div>
      <div class="stat-card amber"><div class="stat-icon">⚠️</div><div class="stat-label">주의</div><div class="stat-val amber" id="cnt-caution">—</div></div>
      <div class="stat-card green"><div class="stat-icon">✅</div><div class="stat-label">안정</div><div class="stat-val green" id="cnt-stable">—</div></div>
    </div>
    <div class="section-label">환자 우선순위 목록</div>
    <div id="patient-list">
      <div class="skeleton-card"><div class="sk-line mid"></div><div class="sk-line short"></div></div>
      <div class="skeleton-card"><div class="sk-line mid"></div><div class="sk-line short"></div></div>
      <div class="skeleton-card"><div class="sk-line mid"></div><div class="sk-line short"></div></div>
    </div>
  </div>

  <div id="detail-view">
    <nav class="detail-nav">
      <button class="back-btn" onclick="closeDetail()"><span style="font-size:16px">←</span> 목록으로</button>
      <div class="detail-nav-title" id="detail-nav-title">환자 상세</div>
    </nav>
    <div id="dp-content"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const PLABELS={Left:'좌측위',Right:'우측위',Supine:'앙와위'};
const PCOLORS={Left:['#E6F1FB','#B5D4F4','#85B7EB','#378ADD','#185FA5'],Right:['#EAF3DE','#C0DD97','#97C459','#639922','#3B6D11'],Supine:['#FAEEDA','#FAC775','#EF9F27','#BA7517','#854F0B']};
const BODY_SPOTS={occiput:{label:'후두부',cx:97,cy:28,r:14},scapula_l:{label:'좌견갑골',cx:78,cy:82,r:12},scapula_r:{label:'우견갑골',cx:116,cy:82,r:12},sacrum:{label:'천골/미골',cx:97,cy:178,r:16},heel_l:{label:'좌발뒤꿈치',cx:81,cy:330,r:10},heel_r:{label:'우발뒤꿈치',cx:113,cy:330,r:10}};
const FNAMES={pressureDuration:'압력 지속',moisture:'습기',activity:'활동',mobility:'이동성',nutrition:'영양',frictionShear:'마찰/전단력',supportSurface:'지지표면'};

let patients=[],radarChart=null,currentDetailId=null,openPanels=new Set();

function acol(s){return s==='immediate'?'red':s==='caution'?'amber':'green';}
function albl(s){return s==='immediate'?'즉시 조치':s==='caution'?'주의':'안정';}
function barcol(s){return s==='immediate'?'#C0392B':s==='caution'?'#9A5E00':'#2D6A2D';}
function fcolor(v){return v>=70?'#C0392B':v>=40?'#9A5E00':'#2D6A2D';}
function spotColor(v){
  if(v>=70)return{fill:'rgba(192,57,43,.4)',stroke:'#C0392B'};
  if(v>=40)return{fill:'rgba(154,94,0,.35)',stroke:'#9A5E00'};
  return{fill:'rgba(45,106,45,.3)',stroke:'#2D6A2D'};
}
function postureFill(pos,ratio){const r=PCOLORS[pos]||PCOLORS.Supine;return r[Math.min(Math.floor(ratio*(r.length-.01)),r.length-1)];}
function elapsed2str(min){return min>=60?`${Math.floor(min/60)}h ${min%60}m`:`${min}m`;}
function nowStr(){const d=new Date();return`${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;}

function buildBodySVG(sr){
  const spots=Object.entries(BODY_SPOTS).map(([k,s])=>{const v=sr[k]||0,c=spotColor(v);return`<circle cx="${s.cx}" cy="${s.cy}" r="${s.r}" fill="${c.fill}" stroke="${c.stroke}" stroke-width="1.5"/>`;}).join('');
  return`<svg viewBox="0 0 194 360" xmlns="http://www.w3.org/2000/svg" style="width:100%;max-width:160px;display:block;margin:0 auto;"><g opacity=".15" fill="#1A1916"><ellipse cx="97" cy="22" rx="18" ry="18"/><rect x="68" y="40" width="58" height="5" rx="3"/><rect x="60" y="44" width="74" height="90" rx="18"/><rect x="34" y="48" width="22" height="70" rx="10"/><rect x="138" y="48" width="22" height="70" rx="10"/><rect x="70" y="132" width="54" height="70" rx="16"/><rect x="60" y="195" width="30" height="90" rx="14"/><rect x="104" y="195" width="30" height="90" rx="14"/><rect x="58" y="278" width="28" height="60" rx="12"/><rect x="108" y="278" width="28" height="60" rx="12"/><rect x="56" y="330" width="32" height="14" rx="7"/><rect x="106" y="330" width="32" height="14" rx="7"/></g>${spots}</svg>`;
}
function buildHeatmap(hm){return(hm||[]).map(s=>`<div class="hm-cell" style="background:${postureFill(s.p,Math.min(s.m/120,1))}" title="${PLABELS[s.p]||s.p} ${s.m}분"></div>`).join('');}

function toggleInline(id){
  const el=document.getElementById('inline-'+id);if(!el)return;
  if(el.style.display==='block'){el.style.display='none';openPanels.delete(id);}
  else{el.style.display='block';openPanels.add(id);}
}

function renderList(data){
  const c=document.getElementById('patient-list');c.innerHTML='';
  document.getElementById('cnt-immediate').textContent=data.filter(p=>p.status==='immediate').length+'명';
  document.getElementById('cnt-caution').textContent=data.filter(p=>p.status==='caution').length+'명';
  document.getElementById('cnt-stable').textContent=data.filter(p=>p.status==='stable').length+'명';
  document.getElementById('ward-label').textContent=`3병동 · 총 ${data.length}명`;
  data.forEach(p=>{
    const col=acol(p.status),nxtCls=p.status==='immediate'?'next-urg':'next-ok';
    const isOver=p.elapsedMinutes>p.maxAllowedMinutes;
    const remaining=p.maxAllowedMinutes-p.elapsedMinutes;
    const hmLen=(p.heatmap||[]).length;
    const actionCls=p.status==='immediate'?'urgent':p.status==='caution'?'caution':'';
    const card=document.createElement('div');card.className=`p-card ${p.status}`;
    card.innerHTML=`
      <div class="p-card-header" onclick="toggleInline('${p.id}')">
        <div class="rank-badge ${col}">${p.priority}</div>
        <div class="p-info"><div class="p-name">${p.name}</div><div class="p-meta">${p.room} · ${p.age}세 · ${p.gender}</div></div>
        <span class="status-pill ${col}">${albl(p.status)}</span>
        <div class="posture-flow">
          <span class="p-chip">${PLABELS[p.currentPosition]||p.currentPosition}</span>
          <span class="arrow-icon">→</span>
          <span class="p-chip ${nxtCls}">${PLABELS[p.recommendedPosition]||p.recommendedPosition}</span>
        </div>
        <span class="score-badge ${col}">${Math.round(p.riskScore)}</span>
        <button class="detail-btn" onclick="event.stopPropagation();openDetail('${p.id}')">상세 →</button>
      </div>
      <div class="risk-bar-track"><div class="risk-bar-fill" style="width:${Math.min(p.riskScore,100)}%;background:${barcol(p.status)}"></div></div>
      <div class="inline-panel" id="inline-${p.id}" style="display:${openPanels.has(p.id)?'block':'none'}">
        <div class="hm-label"><span>자세 경과 히트맵 · ${hmLen}구간</span><span style="font-family:var(--mono)">${elapsed2str(p.elapsedMinutes)} 경과 · ${isOver?Math.abs(remaining)+'분 초과 ⚠':remaining+'분 남음'}</span></div>
        <div class="hm-grid">${buildHeatmap(p.heatmap||[])}</div>
        <div class="hm-legend">
          <div class="hm-leg-item"><div class="hm-leg-swatch" style="background:linear-gradient(to right,#E6F1FB,#185FA5)"></div>좌측위</div>
          <div class="hm-leg-item"><div class="hm-leg-swatch" style="background:linear-gradient(to right,#EAF3DE,#3B6D11)"></div>우측위</div>
          <div class="hm-leg-item"><div class="hm-leg-swatch" style="background:linear-gradient(to right,#FAEEDA,#854F0B)"></div>앙와위</div>
          <span style="font-size:10px;color:var(--txt-tertiary)">연함→진함: 0→120분</span>
        </div>
        <div class="inline-grid">
          <div class="ig-item">현재 체위<div class="ig-val">${PLABELS[p.currentPosition]||p.currentPosition}</div></div>
          <div class="ig-item">권장 행동<div class="ig-val">${p.recommendedAction}</div></div>
          <div class="ig-item">Braden 점수<div class="ig-val">${p.bradenScore}점</div></div>
          <div class="ig-item">진단<div class="ig-val" style="font-size:11px">${p.diagnosis}</div></div>
        </div>
        <div class="action-box ${actionCls}">${p.status==='immediate'?'🚨':p.status==='caution'?'⚠️':'✅'} <strong>${p.recommendedAction}</strong></div>
      </div>`;
    c.appendChild(card);
  });
}

function openDetail(id){
  currentDetailId=id;
  const p=patients.find(x=>x.id===id);if(!p)return;
  if(radarChart){radarChart.destroy();radarChart=null;}
  document.getElementById('list-view').style.display='none';
  document.getElementById('detail-view').style.display='block';
  document.getElementById('detail-nav-title').textContent=p.name+' · '+p.room;
  const isOver=p.elapsedMinutes>p.maxAllowedMinutes;
  const scoreCol=p.riskScore>=70?'danger':p.riskScore>=40?'amber':'ok';
  const factorRows=Object.entries(p.riskFactors||{}).map(([k,v])=>`
    <div class="factor-row">
      <span class="factor-name">${FNAMES[k]||k}</span>
      <div class="factor-track"><div class="factor-fill" style="width:${Math.max(0,Math.min(v,100))}%;background:${fcolor(v)}"></div></div>
      <span class="factor-score" style="color:${fcolor(v)}">${v}</span>
    </div>`).join('');
  const tlData=(p.heatmap||[]).slice(-6).map((seg,i,arr)=>({p:seg.p,t:i===arr.length-1?'현재':`-${(arr.length-1-i)*15}분`}));
  const tlCells=tlData.map((t,i)=>{const isLast=i===tlData.length-1;const cls=t.p.toLowerCase();return`<div class="tl-cell"><div><span class="tl-chip ${cls}">${PLABELS[t.p]||t.p}</span></div><div class="tl-line-row"><div class="${isLast?'tl-dot active':'tl-dot'}"></div><div class="${isLast?'tl-seg danger':'tl-seg'}"></div></div><div class="tl-time">${t.t}</div></div>`;}).join('');
  const highSpots=Object.entries(p.spotRisks||{}).filter(([,v])=>v>=70).map(([k])=>BODY_SPOTS[k]?BODY_SPOTS[k].label:k);
  const spotListHtml=highSpots.length?highSpots.map(s=>`<div class="bleg-spot"><div class="bleg-spot-dot"></div>${s}</div>`).join(''):`<div style="font-size:11px;color:var(--txt-tertiary)">고위험 부위 없음</div>`;
  const alertBox=p.status==='immediate'
    ?`<div class="alert-box danger"><span class="alert-icon">🚨</span><div><strong>즉시 조치 필요</strong><br>장시간 ${PLABELS[p.currentPosition]} 유지로 압력 및 피부 손상 위험이 높습니다.<br><strong>권장: ${p.recommendedAction}</strong></div></div>`
    :p.status==='caution'
    ?`<div class="alert-box warn"><span class="alert-icon">⚠️</span><div><strong>주의 관찰 필요</strong><br>${p.recommendedAction}</div></div>`:'';

  document.getElementById('dp-content').innerHTML=`
    <div class="dp-header">
      <div class="dp-hrow">
        <div class="dp-avatar">👤</div>
        <div><div class="dp-name">${p.name}</div><div class="dp-sub">${p.room} · ${p.age}세 · ${p.gender}<br><span>진단:</span> ${p.diagnosis} &nbsp;·&nbsp; <span>Braden:</span> ${p.bradenScore}점</div></div>
        <span class="status-pill ${acol(p.status)}" style="margin-left:auto;align-self:flex-start">${albl(p.status)}</span>
      </div>
      <div class="dp-metrics">
        <div class="dp-metric"><div class="dp-metric-lbl">현재 체위</div><div class="dp-metric-val blue" style="font-size:13px;font-family:var(--font)">${PLABELS[p.currentPosition]||p.currentPosition}</div></div>
        <div class="dp-metric"><div class="dp-metric-lbl">권장 체위</div><div class="dp-metric-val ok" style="font-size:13px;font-family:var(--font)">${PLABELS[p.recommendedPosition]||p.recommendedPosition}</div></div>
        <div class="dp-metric"><div class="dp-metric-lbl">경과 시간</div><div class="dp-metric-val ${isOver?'danger':''}">${elapsed2str(p.elapsedMinutes)}</div><div class="dp-metric-sub">${isOver?'⚠ 초과':'정상 범위'}</div></div>
        <div class="dp-metric"><div class="dp-metric-lbl">위험 점수</div><div class="dp-metric-val ${scoreCol}">${Math.round(p.riskScore)}</div><div class="dp-metric-sub">${p.riskScore>=70?'위험':p.riskScore>=40?'주의':'안전'}</div></div>
      </div>
      ${alertBox}
    </div>
    <div class="dp-two-col">
      <div class="dp-section"><div class="dp-sec-title">위험 요인 레이더</div><div style="position:relative;height:180px"><canvas id="radar-chart"></canvas></div></div>
      <div class="dp-section"><div class="dp-sec-title">요인별 위험도</div>${factorRows}<div class="factor-legend"><span><b style="color:#2D6A2D">■</b> 0–39 안전</span><span><b style="color:#9A5E00">■</b> 40–69 주의</span><span><b style="color:#C0392B">■</b> 70+ 위험</span></div></div>
    </div>
    <div class="dp-section"><div class="dp-sec-title">신체 부위별 압력 위험도</div><div class="body-map-row"><div class="body-map-svg">${buildBodySVG(p.spotRisks||{})}</div><div class="body-map-legend"><div class="bleg-title">위험도 범례</div><div class="bleg-item"><div class="bleg-dot" style="background:rgba(192,57,43,.4);border:1.5px solid #C0392B"></div>고위험</div><div class="bleg-item"><div class="bleg-dot" style="background:rgba(154,94,0,.35);border:1.5px solid #9A5E00"></div>주의</div><div class="bleg-item"><div class="bleg-dot" style="background:rgba(45,106,45,.3);border:1.5px solid #2D6A2D"></div>안전</div><div class="bleg-spots-title">주요 고위험</div>${spotListHtml}</div></div></div>
    <div class="dp-section"><div class="dp-sec-title">최근 체위 변화 타임라인</div><div class="tl-wrap"><div class="tl-row">${tlCells}</div></div></div>`;

  requestAnimationFrame(()=>{
    const ctx=document.getElementById('radar-chart');if(!ctx)return;
    const rf=p.riskFactors||{};const fKeys=Object.keys(rf);
    radarChart=new Chart(ctx,{type:'radar',data:{labels:fKeys.map(k=>FNAMES[k]||k),datasets:[{label:'위험도',data:fKeys.map(k=>rf[k]),backgroundColor:'rgba(192,57,43,.12)',borderColor:'#C0392B',borderWidth:1.5,pointBackgroundColor:'#C0392B',pointRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{r:{min:0,max:100,ticks:{stepSize:25,font:{size:9},color:'#9B9A93'},pointLabels:{font:{size:9},color:'#6B6960'},grid:{color:'rgba(0,0,0,.07)'},angleLines:{color:'rgba(0,0,0,.07)'}}}}});
  });
}

function closeDetail(){
  currentDetailId=null;
  if(radarChart){radarChart.destroy();radarChart=null;}
  document.getElementById('detail-view').style.display='none';
  document.getElementById('list-view').style.display='block';
}

async function fetchAndRender(){
  const dot=document.getElementById('refresh-dot');dot.classList.add('loading');
  try{
    const res=await fetch('/api/patients');const data=await res.json();
    patients=data;renderList(patients);
    if(currentDetailId)openDetail(currentDetailId);
    document.getElementById('refresh-time').textContent=nowStr()+' 갱신';
    dot.classList.remove('loading');
  }catch(e){
    console.error('데이터 로딩 실패:',e);
    document.getElementById('patient-list').innerHTML='<div style="padding:20px;text-align:center;color:var(--txt-tertiary)">데이터를 불러올 수 없습니다.</div>';
    dot.classList.remove('loading');
  }
}
fetchAndRender();
setInterval(fetchAndRender,10000);
</script>
</body>
</html>
