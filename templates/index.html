<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>욕창 예방 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#F5F4F0;--surface:#FFFFFF;--surface2:#F0EFE9;
  --border:#E2E0D8;--border2:#D0CEC4;
  --txt-primary:#1A1916;--txt-secondary:#6B6960;--txt-tertiary:#9B9A93;
  --red:#C0392B;--red-light:#FCECEA;--red-mid:#F4A59A;
  --amber:#9A5E00;--amber-light:#FDF3E3;--amber-mid:#F0C070;
  --green:#2D6A2D;--green-light:#EAF4E8;--green-mid:#82C082;
  --blue:#1A56A0;--blue-light:#E8F1FC;
  --r-sm:6px;--r-md:10px;--r-lg:14px;
  --sh-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --sh-md:0 4px 12px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.05);
  --font:'Noto Sans KR',sans-serif;--mono:'DM Mono',monospace;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:14px;-webkit-font-smoothing:antialiased}
body{font-family:var(--font);background:var(--bg);color:var(--txt-primary);min-height:100vh}
#app{max-width:680px;margin:0 auto;padding:0 16px 40px}

/* 헤더 */
.header{display:flex;align-items:center;justify-content:space-between;padding:20px 0 16px;border-bottom:1px solid var(--border);margin-bottom:20px;gap:12px}
.header-left{display:flex;align-items:center;gap:10px}
.header-icon{width:36px;height:36px;background:var(--txt-primary);border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;flex-shrink:0}
.header-title{font-size:15px;font-weight:700;letter-spacing:-.3px}
.header-sub{font-size:11px;color:var(--txt-tertiary);margin-top:1px}
.refresh-badge{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--txt-tertiary);font-family:var(--mono)}
.refresh-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
.refresh-dot.loading{background:var(--amber);animation:spin-dot 1s linear infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes spin-dot{0%{transform:scale(1)}50%{transform:scale(1.4)}100%{transform:scale(1)}}

/* 통계 카드 */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--sh-sm);transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r-lg) var(--r-lg) 0 0}
.stat-card.red::before{background:var(--red)}.stat-card.amber::before{background:var(--amber)}.stat-card.green::before{background:var(--green)}
.stat-card:hover{transform:translateY(-1px);box-shadow:var(--sh-md)}
.stat-icon{font-size:18px;margin-bottom:6px}
.stat-label{font-size:11px;color:var(--txt-secondary);font-weight:500;margin-bottom:4px}
.stat-val{font-size:26px;font-weight:700;font-family:var(--mono)}
.stat-val.red{color:var(--red)}.stat-val.amber{color:var(--amber)}.stat-val.green{color:var(--green)}

/* 섹션 레이블 */
.section-label{font-size:11px;font-weight:600;color:var(--txt-tertiary);letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px}

/* 환자 카드 */
.p-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:8px;box-shadow:var(--sh-sm);overflow:hidden;transition:box-shadow .15s}
.p-card:hover{box-shadow:var(--sh-md)}
.p-card.immediate{border-left:3px solid var(--red)}.p-card.caution{border-left:3px solid var(--amber)}.p-card.stable{border-left:3px solid var(--green-mid)}
.p-card-header{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none}
.p-card-header:hover{background:var(--surface2)}
.rank-badge{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;font-family:var(--mono)}
.rank-badge.red{background:var(--red-light);color:var(--red)}.rank-badge.amber{background:var(--amber-light);color:var(--amber)}.rank-badge.green{background:var(--green-light);color:var(--green)}
.p-info{flex:1;min-width:0}
.p-name{font-size:13px;font-weight:600}
.p-meta{font-size:11px;color:var(--txt-tertiary);margin-top:1px}
.status-pill{font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap;flex-shrink:0;letter-spacing:.2px}
.status-pill.red{background:var(--red-light);color:var(--red)}.status-pill.amber{background:var(--amber-light);color:var(--amber)}.status-pill.green{background:var(--green-light);color:var(--green)}
.posture-flow{display:flex;align-items:center;gap:5px;flex-shrink:0}
.p-chip{font-size:10px;font-weight:600;padding:3px 7px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface2);color:var(--txt-secondary);white-space:nowrap}
.p-chip.next-ok{background:var(--green-light);color:var(--green);border-color:var(--green-mid)}
.p-chip.next-urg{background:var(--red-light);color:var(--red);border-color:var(--red-mid)}
.arrow-icon{font-size:10px;color:var(--txt-tertiary)}
.score-badge{font-size:13px;font-weight:700;font-family:var(--mono);width:36px;text-align:right;flex-shrink:0}
.score-badge.red{color:var(--red)}.score-badge.amber{color:var(--amber)}.score-badge.green{color:var(--green)}
.detail-btn{font-size:10px;padding:4px 9px;border:1px solid var(--border2);border-radius:var(--r-sm);background:transparent;color:var(--txt-secondary);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:background .12s,color .12s}
.detail-btn:hover{background:var(--surface2);color:var(--txt-primary)}
.risk-bar-track{height:2px;background:var(--surface2)}
.risk-bar-fill{height:2px;transition:width .4s ease}

/* 인라인 패널 */
.inline-panel{border-top:1px solid var(--border);padding:12px 14px;display:none;background:var(--bg);animation:slideDown .15s ease}
@keyframes slideDown{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.hm-label{display:flex;justify-content:space-between;font-size:10px;color:var(--txt-tertiary);margin-bottom:5px}
.hm-grid{display:flex;gap:2px;height:28px;border-radius:var(--r-sm);overflow:hidden}
.hm-cell{flex:1}
.hm-legend{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap}
.hm-leg-item{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--txt-tertiary)}
.hm-leg-swatch{width:20px;height:6px;border-radius:2px}
.inline-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ig-item{font-size:11px;color:var(--txt-secondary)}
.ig-val{font-size:12px;font-weight:600;color:var(--txt-primary);margin-top:2px}
.action-box{margin-top:10px;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);font-size:12px;font-weight:500;display:flex;align-items:center;gap:7px}
.action-box.urgent{border-color:var(--red-mid);background:var(--red-light);color:var(--red)}
.action-box.caution{border-color:var(--amber-mid);background:var(--amber-light);color:var(--amber)}

/* 상세 페이지 */
#detail-view{display:none}
.detail-nav{display:flex;align-items:center;gap:10px;padding:16px 0 14px;border-bottom:1px solid var(--border);margin-bottom:16px}
.back-btn{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--txt-secondary);background:none;border:none;cursor:pointer;padding:0;transition:color .12s}
.back-btn:hover{color:var(--txt-primary)}
.detail-nav-title{font-size:14px;font-weight:600}
.dp-header{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;box-shadow:var(--sh-sm)}
.dp-hrow{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.dp-avatar{width:46px;height:46px;border-radius:50%;background:var(--blue-light);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.dp-name{font-size:16px;font-weight:700}
.dp-sub{font-size:11px;color:var(--txt-secondary);margin-top:3px;line-height:1.5}
.dp-sub span{color:var(--txt-tertiary)}
.dp-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dp-metric{background:var(--surface2);border-radius:var(--r-md);padding:10px 12px}
.dp-metric-lbl{font-size:10px;color:var(--txt-tertiary);font-weight:500;margin-bottom:4px}
.dp-metric-val{font-size:16px;font-weight:700;font-family:var(--mono)}
.dp-metric-val.blue{color:var(--blue)}.dp-metric-val.danger{color:var(--red)}.dp-metric-val.amber{color:var(--amber)}.dp-metric-val.ok{color:var(--green)}
.dp-metric-sub{font-size:10px;color:var(--txt-tertiary);margin-top:2px}
.dp-section{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;box-shadow:var(--sh-sm)}
.dp-sec-title{font-size:12px;font-weight:700;color:var(--txt-secondary);letter-spacing:.5px;text-transform:uppercase;margin-bottom:14px}
.dp-two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.factor-row{display:flex;align-items:center;gap:8px;margin-bottom:9px;font-size:11px}
.factor-name{width:66px;color:var(--txt-secondary);flex-shrink:0;line-height:1.3}
.factor-track{flex:1;height:7px;background:var(--surface2);border-radius:4px;overflow:hidden}
.factor-fill{height:7px;border-radius:4px;transition:width .5s ease}
.factor-score{width:36px;text-align:right;font-weight:700;font-family:var(--mono);font-size:11px}
.factor-legend{display:flex;gap:12px;font-size:10px;color:var(--txt-tertiary);margin-top:6px}
.body-map-row{display:flex;gap:16px;align-items:flex-start}
.body-map-svg{flex:1;min-width:0}
.body-map-legend{flex-shrink:0;width:110px}
.bleg-title{font-size:11px;font-weight:700;color:var(--txt-secondary);text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px}
.bleg-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--txt-secondary);margin-bottom:7px}
.bleg-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.bleg-spots-title{font-size:11px;font-weight:700;color:var(--txt-secondary);text-transform:uppercase;letter-spacing:.4px;margin:14px 0 8px}
.bleg-spot{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--txt-secondary);margin-bottom:5px}
.bleg-spot-dot{width:7px;height:7px;border-radius:50%;background:var(--red);flex-shrink:0}
.tl-wrap{overflow-x:auto;padding-bottom:4px}
.tl-row{display:flex;align-items:flex-start}
.tl-cell{flex:1;min-width:64px;text-align:center}
.tl-chip{display:inline-block;padding:4px 8px;border-radius:var(--r-sm);font-size:10px;font-weight:600;margin-bottom:6px;white-space:nowrap}
.tl-chip.left{background:var(--blue-light);color:var(--blue)}.tl-chip.right{background:var(--green-light);color:var(--green)}.tl-chip.supine{background:var(--amber-light);color:var(--amber)}
.tl-line-row{display:flex;align-items:center;height:18px}
.tl-dot{width:9px;height:9px;border-radius:50%;background:var(--border2);flex-shrink:0;margin:0 auto}
.tl-dot.active{background:var(--red);box-shadow:0 0 0 3px var(--red-light)}
.tl-seg{flex:1;height:2px;background:var(--border)}.tl-seg.danger{background:var(--red)}
.tl-time{font-size:10px;color:var(--txt-tertiary);margin-top:5px;font-family:var(--mono)}
.alert-box{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);border:1px solid;margin-top:12px;font-size:12px;line-height:1.5}
.alert-box.danger{background:var(--red-light);border-color:var(--red-mid);color:var(--red)}
.alert-box.warn{background:var(--amber-light);border-color:var(--amber-mid);color:var(--amber)}
.alert-icon{font-size:16px;flex-shrink:0}
.skeleton-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;margin-bottom:8px;animation:shimmer 1.4s infinite}
.sk-line{height:10px;background:var(--surface2);border-radius:4px;margin-bottom:8px}
.sk-line.short{width:40%}.sk-line.mid{width:65%}
@keyframes shimmer{0%,100%{opacity:1}50%{opacity:.5}}

/* 환자 실제 영상 */
.patient-video-wrap{margin-top:12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh-sm)}
.patient-video-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px;border-bottom:1px solid var(--border);font-size:11px;color:var(--txt-secondary);font-weight:600}
.patient-video-status{font-size:10px;font-weight:700;padding:3px 7px;border-radius:20px;background:var(--blue-light);color:var(--blue);white-space:nowrap}
.patient-video{width:100%;display:block;background:#000;max-height:360px;object-fit:contain}
.video-caption{padding:8px 10px;font-size:11px;color:var(--txt-secondary);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;line-height:1.4}
.video-empty{margin-top:12px;padding:12px;border:1px dashed var(--border2);border-radius:var(--r-md);font-size:11px;color:var(--txt-tertiary);background:var(--surface2)}


/* 상세 탭 */
.detail-tabs{display:flex;gap:6px;margin:0 0 12px;padding:4px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--sh-sm)}
.detail-tab-btn{flex:1;border:0;background:transparent;color:var(--txt-secondary);font-family:var(--font);font-size:12px;font-weight:700;border-radius:var(--r-md);padding:9px 10px;cursor:pointer;transition:background .12s,color .12s,box-shadow .12s}
.detail-tab-btn:hover{color:var(--txt-primary)}
.detail-tab-btn.active{background:var(--surface);color:var(--txt-primary);box-shadow:var(--sh-sm)}
.detail-tab-panel{display:none}
.detail-tab-panel.active{display:block;animation:slideDown .15s ease}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* YOLO 체위 분류 탭 */
.yolo-panel{font-family:var(--font);padding:0}
.yolo-sec{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;box-shadow:var(--sh-sm)}
.yolo-sec-title{font-size:11px;font-weight:700;color:var(--txt-secondary);letter-spacing:.5px;text-transform:uppercase;margin-bottom:14px}
.yolo-video-wrap{background:#000;border-radius:var(--r-md);aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;margin-bottom:14px;border:1px solid var(--border)}
.yolo-video-placeholder{color:#fff;font-size:13px;opacity:.65;text-align:center;padding:18px;line-height:1.5}
.yolo-video{width:100%;height:100%;display:block;background:#000;object-fit:contain}
.yolo-overlay-badge{position:absolute;top:10px;left:10px;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.68);border-radius:20px;padding:5px 10px;backdrop-filter:blur(4px)}
.yolo-overlay-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;flex-shrink:0;animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.yolo-overlay-text{font-size:11px;font-weight:700;color:#fff}
.yolo-overlay-conf{font-size:10px;color:rgba(255,255,255,.72)}
.yolo-metrics-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.yolo-metric-card{background:var(--surface2);border-radius:var(--r-md);padding:10px 12px}
.yolo-metric-lbl{font-size:11px;color:var(--txt-secondary);margin-bottom:3px}
.yolo-metric-val{font-size:16px;font-weight:700;color:var(--txt-primary);font-family:var(--mono)}
.yolo-metric-sub{font-size:10px;color:var(--txt-tertiary);margin-top:1px}
.yolo-cls-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.yolo-cls-label{font-size:12px;font-weight:600;color:var(--txt-primary);width:70px;flex-shrink:0;line-height:1.2}
.yolo-cls-track{flex:1;height:22px;background:var(--surface2);border-radius:var(--r-md);overflow:hidden;position:relative;border:1px solid var(--border)}
.yolo-cls-fill{height:100%;border-radius:var(--r-md);transition:width .5s ease;display:flex;align-items:center;padding-left:8px;min-width:2px}
.yolo-cls-fill-label{font-size:11px;font-weight:700;white-space:nowrap}
.yolo-cls-pct{font-size:12px;font-weight:700;width:42px;text-align:right;flex-shrink:0;font-family:var(--mono)}
.yolo-badge-active{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;margin-left:6px;white-space:nowrap}
.yolo-conf-gauge-row{display:flex;align-items:center;gap:10px;margin:12px 0 2px}
.yolo-conf-gauge-track{flex:1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;border:1px solid var(--border)}
.yolo-conf-gauge-fill{height:100%;border-radius:3px;transition:width .5s ease;background:var(--green)}
.yolo-conf-label{font-size:11px;color:var(--txt-secondary);width:70px;flex-shrink:0}
.yolo-conf-val{font-size:12px;font-weight:700;color:var(--txt-primary);width:38px;text-align:right;flex-shrink:0;font-family:var(--mono)}
.yolo-two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.yolo-hist-row{display:flex;gap:4px;align-items:flex-end;height:48px;margin-bottom:6px}
.yolo-hist-bar{flex:1;border-radius:3px 3px 0 0;min-height:4px;transition:height .3s ease}
.yolo-hist-labels{display:flex;gap:4px}
.yolo-hist-lbl{flex:1;font-size:9px;color:var(--txt-tertiary);text-align:center;overflow:hidden;font-family:var(--mono)}
.yolo-legend-row{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap}
.yolo-legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--txt-secondary)}
.yolo-legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.yolo-slider-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12px;color:var(--txt-secondary)}
.yolo-slider-row input{flex:1;accent-color:var(--blue)}
.yolo-sim-btn{font-size:11px;font-weight:700;padding:7px 12px;border:1px solid var(--border2);border-radius:var(--r-md);background:var(--surface);color:var(--txt-primary);cursor:pointer;width:100%;margin-top:4px;transition:background .12s,border-color .12s}
.yolo-sim-btn:hover{background:var(--surface2);border-color:var(--txt-tertiary)}
.yolo-empty-note{font-size:11px;color:var(--txt-tertiary);line-height:1.5;margin-top:8px}
.yolo-history-sec{width:100%;}
.yolo-history-sec .yolo-hist-row{height:64px;}

@media(max-width:480px){.dp-metrics{grid-template-columns:repeat(2,1fr)}.dp-two-col,.yolo-two-col{grid-template-columns:1fr}.yolo-metrics-grid{grid-template-columns:1fr}.posture-flow{display:none}.stat-val{font-size:22px}}
</style>
</head>
<body>
<div id="app">
  <div id="list-view">
    <header class="header">
      <div class="header-left">
        <div class="header-icon">🏥</div>
        <div>
          <div class="header-title">욕창 예방 대시보드</div>
          <div class="header-sub" id="ward-label">3병동 · 로딩 중...</div>
        </div>
      </div>
      <div class="refresh-badge">
        <div class="refresh-dot" id="refresh-dot"></div>
        <span id="refresh-time">—</span>
      </div>
    </header>
    <div class="stat-grid">
      <div class="stat-card red"><div class="stat-icon">🚨</div><div class="stat-label">즉시 조치</div><div class="stat-val red" id="cnt-immediate">—</div></div>
      <div class="stat-card amber"><div class="stat-icon">⚠️</div><div class="stat-label">주의</div><div class="stat-val amber" id="cnt-caution">—</div></div>
      <div class="stat-card green"><div class="stat-icon">✅</div><div class="stat-label">안정</div><div class="stat-val green" id="cnt-stable">—</div></div>
    </div>
    <div class="section-label">환자 우선순위 목록</div>
    <div id="patient-list">
      <div class="skeleton-card"><div class="sk-line mid"></div><div class="sk-line short"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const PLABELS={Left:'좌측위',Right:'우측위',Supine:'앙와위'};
const PCOLORS={Left:['#E6F1FB','#B5D4F4','#85B7EB','#378ADD','#185FA5'],Right:['#EAF3DE','#C0DD97','#97C459','#639922','#3B6D11'],Supine:['#FAEEDA','#FAC775','#EF9F27','#BA7517','#854F0B']};
const BODY_SPOTS={occiput:{label:'후두부',cx:97,cy:28,r:14},scapula_l:{label:'좌견갑골',cx:78,cy:82,r:12},scapula_r:{label:'우견갑골',cx:116,cy:82,r:12},sacrum:{label:'천골/미골',cx:97,cy:178,r:16},heel_l:{label:'좌발뒤꿈치',cx:81,cy:330,r:10},heel_r:{label:'우발뒤꿈치',cx:113,cy:330,r:10}};
const BRADEN_ITEMS=[
  {key:'sensoryPerception',label:'감각인지',min:1,max:4},
  {key:'moisture',label:'습기',min:1,max:4},
  {key:'activity',label:'활동',min:1,max:4},
  {key:'mobility',label:'이동성',min:1,max:4},
  {key:'nutrition',label:'영양',min:1,max:4},
  {key:'frictionShear',label:'마찰/전단력',min:1,max:3},
];

const YOLO_POSTURES=[
  {key:'Left',label:'좌측위',color:'#378ADD',fill:'rgba(55,138,221,.18)',textColor:'#185FA5'},
  {key:'Right',label:'우측위',color:'#639922',fill:'rgba(99,153,34,.18)',textColor:'#3B6D11'},
  {key:'Supine',label:'앙와위',color:'#BA7517',fill:'rgba(186,117,23,.18)',textColor:'#854F0B'},
];
const YOLO_PANEL_STATE={};

let patients=[],radarChart=null,currentDetailId=null,openPanels=new Set();

function acol(s){return s==='immediate'?'red':s==='caution'?'amber':'green';}
function albl(s){return s==='immediate'?'즉시 조치':s==='caution'?'주의':'안정';}
function riskLabel(p){return (p&&p.bradenRiskGroup)||albl(p&&p.status);}
function bradenScoreText(p){const v=Number(p&&p.bradenScore);return Number.isFinite(v)?Math.round(v):'—';}
function bradenRiskPct(p){const raw=(p&&p.bradenRiskPercent!==undefined)?p.bradenRiskPercent:(p&&p.riskScore);const v=Number(raw);return Math.max(0,Math.min(100,Number.isFinite(v)?v:0));}
function scoreClass(p){return p&&p.status==='immediate'?'danger':p&&p.status==='caution'?'amber':'ok';}
function getBradenChartItems(p){
  const raw=(p&&p.bradenItems&&typeof p.bradenItems==='object')?p.bradenItems:{};
  return BRADEN_ITEMS.map(item=>{
    const rawScore=Number(raw[item.key]);
    const score=Number.isFinite(rawScore)?Math.max(item.min,Math.min(item.max,rawScore)):item.max;
    const risk=item.max===item.min?0:clampPct((item.max-score)/(item.max-item.min)*100);
    return {...item,score,risk};
  });
}
function bradenItemScoreText(item){return `${Math.round(item.score)}/${item.max}`;}
function barcol(s){return s==='immediate'?'#C0392B':s==='caution'?'#9A5E00':'#2D6A2D';}
function fcolor(v){return v>=70?'#C0392B':v>=40?'#9A5E00':'#2D6A2D';}
function spotColor(v){
  if(v>=70)return{fill:'rgba(192,57,43,.4)',stroke:'#C0392B'};
  if(v>=40)return{fill:'rgba(154,94,0,.35)',stroke:'#9A5E00'};
  return{fill:'rgba(45,106,45,.3)',stroke:'#2D6A2D'};
}
function postureFill(pos,ratio){const r=PCOLORS[pos]||PCOLORS.Supine;return r[Math.min(Math.floor(ratio*(r.length-.01)),r.length-1)];}
function elapsed2str(min){return min>=60?`${Math.floor(min/60)}h ${min%60}m`:`${min}m`;}
function nowStr(){const d=new Date();return`${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;}
function getVideoUrl(p){return p.videoUrl || (p.videoFile ? `/static/videos/${p.videoFile}` : '');}
function confStr(v){return v===undefined||v===null||v===''?'—':`${Math.round(Number(v)*100)}%`;}

function clampPct(v){return Math.max(0,Math.min(100,Math.round(Number(v)||0)));}
function yoloMeta(key){return YOLO_POSTURES.find(x=>x.key===key)||YOLO_POSTURES[2];}
function topYoloClass(probs){
  const entries=YOLO_POSTURES.map(p=>[p.key,Number(probs&&probs[p.key])||0]);
  return entries.sort((a,b)=>b[1]-a[1])[0];
}
function normalizeYoloProbabilities(raw){
  if(!raw||typeof raw!=='object')return null;
  const out={Left:0,Right:0,Supine:0};
  let has=false;
  YOLO_POSTURES.forEach(p=>{
    let v=Number(raw[p.key]);
    if(Number.isFinite(v)){
      if(v>=0&&v<=1)v*=100;
      out[p.key]=Math.max(0,v);has=true;
    }
  });
  if(!has)return null;
  const total=Object.values(out).reduce((a,b)=>a+b,0);
  if(total<=0)return null;
  YOLO_POSTURES.forEach(p=>{out[p.key]=clampPct(out[p.key]/total*100);});
  const diff=100-Object.values(out).reduce((a,b)=>a+b,0);
  if(diff!==0){const [topKey]=topYoloClass(out);out[topKey]=clampPct(out[topKey]+diff);}
  return out;
}
function deriveYoloProbabilities(topKey,confidence){
  const probs={Left:0,Right:0,Supine:0};
  const safeTop=YOLO_POSTURES.some(p=>p.key===topKey)?topKey:'Supine';
  let conf=Number(confidence);
  const known=Number.isFinite(conf)&&conf>0;
  if(known&&conf<=1)conf*=100;
  const topPct=known?clampPct(conf):100;
  const rest=Math.max(0,100-topPct);
  probs[safeTop]=topPct;
  YOLO_POSTURES.filter(p=>p.key!==safeTop).forEach(p=>{probs[p.key]=Math.round(rest/2);});
  const diff=100-Object.values(probs).reduce((a,b)=>a+b,0);
  if(diff!==0)probs[safeTop]=clampPct(probs[safeTop]+diff);
  return{probs,confidenceKnown:known};
}
function patientYoloSnapshot(p){
  const normalized=normalizeYoloProbabilities(p&&p.postureProbabilities);
  if(normalized)return{probs:normalized,confidenceKnown:true};
  return deriveYoloProbabilities(p&&p.currentPosition, p&&p.postureConfidence);
}
function ensureYoloState(p){
  if(!p)return null;
  const snap=patientYoloSnapshot(p);
  if(!YOLO_PANEL_STATE[p.id]){
    let history=(p.postureSummaryTimeline||p.timeline||[]).map(x=>x.p).filter(Boolean).slice(-5);
    if(history.length===0&&Array.isArray(p.heatmap))history=p.heatmap.map(x=>x.p).filter(Boolean).slice(-5);
    while(history.length<5)history.unshift(p.currentPosition||'Supine');
    YOLO_PANEL_STATE[p.id]={probs:snap.probs,confidenceKnown:snap.confidenceKnown,history};
  }else{
    YOLO_PANEL_STATE[p.id].probs=snap.probs;
    YOLO_PANEL_STATE[p.id].confidenceKnown=snap.confidenceKnown;
    if(!Array.isArray(YOLO_PANEL_STATE[p.id].history)||YOLO_PANEL_STATE[p.id].history.length===0){
      YOLO_PANEL_STATE[p.id].history=Array(5).fill(p.currentPosition||'Supine');
    }
  }
  return YOLO_PANEL_STATE[p.id];
}
function buildYoloPanel(p){
  const videoUrl=getVideoUrl(p);
  const videoHtml=videoUrl
    ?`<video class="yolo-video" id="patient-video-${p.id}" src="${videoUrl}" controls autoplay muted loop playsinline preload="metadata"></video>`
    :`<div class="yolo-video-placeholder">연결된 환자 영상이 없습니다.<br>patients.json에 <strong>videoFile</strong> 또는 백엔드 응답에 <strong>videoUrl</strong>을 추가하세요.</div>`;
  return`
    <div class="yolo-panel">
      <h2 class="sr-only">딥러닝 체위 분류 출력 시각화 패널 — YOLO 모델의 실시간 분류 결과를 보여줍니다.</h2>
      <div class="yolo-sec">
        <div class="yolo-sec-title">실제 환자 체위 영상</div>
        <div class="yolo-video-wrap">
          ${videoHtml}
          <div class="yolo-overlay-badge">
            <div class="yolo-overlay-dot"></div>
            <span class="yolo-overlay-text" id="yolo-overlay-label-${p.id}">${PLABELS[p.currentPosition]||p.currentPosition}</span>
            <span class="yolo-overlay-conf" id="yolo-overlay-conf-${p.id}">${confStr(p.postureConfidence)}</span>
          </div>
        </div>
        <div class="yolo-metrics-grid">
          <div class="yolo-metric-card"><div class="yolo-metric-lbl">현재 분류</div><div class="yolo-metric-val" id="yolo-m-posture-${p.id}" style="font-size:14px;font-family:var(--font)">—</div><div class="yolo-metric-sub">YOLO-cls</div></div>
          <div class="yolo-metric-card"><div class="yolo-metric-lbl">분류 신뢰도</div><div class="yolo-metric-val" id="yolo-m-conf-${p.id}">—</div><div class="yolo-metric-sub" id="yolo-m-conf-sub-${p.id}">수신 대기</div></div>
          <div class="yolo-metric-card"><div class="yolo-metric-lbl">5초 대표</div><div class="yolo-metric-val" id="yolo-m-majority-${p.id}" style="font-size:14px;font-family:var(--font)">—</div><div class="yolo-metric-sub" id="yolo-m-votes-${p.id}">0 / 5 votes</div></div>
        </div>
        <div class="yolo-sec-title" style="margin-bottom:10px">클래스별 softmax 확률</div>
        <div id="yolo-cls-rows-${p.id}"></div>
        <div class="yolo-conf-gauge-row">
          <span class="yolo-conf-label">분류 신뢰도</span>
          <div class="yolo-conf-gauge-track"><div class="yolo-conf-gauge-fill" id="yolo-conf-fill-${p.id}" style="width:0%"></div></div>
          <span class="yolo-conf-val" id="yolo-conf-val-txt-${p.id}">—</span>
        </div>
        <div class="yolo-empty-note">실제 재생 프레임의 YOLO 결과가 1초마다 갱신되고, 최근 5초 대표 체위는 수집된 vote 기준으로 표시됩니다.</div>
      </div>
      <div class="yolo-sec yolo-history-sec">
        <div class="yolo-sec-title">최근 5초 분류 히스토리</div>
        <div class="yolo-hist-row" id="yolo-hist-bars-${p.id}"></div>
        <div class="yolo-hist-labels" id="yolo-hist-labels-${p.id}"></div>
        <div class="yolo-legend-row">
          <div class="yolo-legend-item"><div class="yolo-legend-dot" style="background:#378ADD"></div>좌측위</div>
          <div class="yolo-legend-item"><div class="yolo-legend-dot" style="background:#639922"></div>우측위</div>
          <div class="yolo-legend-item"><div class="yolo-legend-dot" style="background:#BA7517"></div>앙와위</div>
        </div>
      </div>
    </div>`;
}
function renderYoloClsRows(id){
  const state=YOLO_PANEL_STATE[id];const el=document.getElementById(`yolo-cls-rows-${id}`);if(!state||!el)return;
  const [topKey]=topYoloClass(state.probs);
  el.innerHTML=YOLO_POSTURES.map(p=>{
    const v=clampPct(state.probs[p.key]);const isTop=p.key===topKey;const barW=Math.max(v,2);const showLabel=v>12;
    return`<div class="yolo-cls-row${isTop?' active':''}">
      <span class="yolo-cls-label" style="${isTop?'font-weight:700':''}">${p.label}${isTop?`<span class="yolo-badge-active" style="background:${p.fill};color:${p.textColor}">분류</span>`:''}</span>
      <div class="yolo-cls-track"><div class="yolo-cls-fill" style="width:${barW}%;background:${p.fill};border-right:2px solid ${p.color}">${showLabel?`<span class="yolo-cls-fill-label" style="color:${p.textColor}">${p.label}</span>`:''}</div></div>
      <span class="yolo-cls-pct" style="color:${isTop?p.textColor:'var(--txt-secondary)'}">${state.confidenceKnown?Math.round(v)+'%':'—'}</span>
    </div>`;
  }).join('');
}
function renderYoloMetrics(id){
  const state=YOLO_PANEL_STATE[id];if(!state)return;
  const [topKey,topVal]=topYoloClass(state.probs);const meta=yoloMeta(topKey);
  const confTxt=state.confidenceKnown?Math.round(topVal)+'%':'—';
  const set=(suffix,value)=>{const el=document.getElementById(`yolo-${suffix}-${id}`);if(el)el.textContent=value;};
  set('m-posture',meta.label);set('m-conf',confTxt);set('conf-val-txt',confTxt);set('overlay-label',meta.label);set('overlay-conf',confTxt);
  const postureEl=document.getElementById(`yolo-m-posture-${id}`);if(postureEl)postureEl.style.color=meta.textColor;
  const confSub=document.getElementById(`yolo-m-conf-sub-${id}`);if(confSub)confSub.textContent=state.confidenceKnown?(topVal>=80?'높음':topVal>=60?'보통':'낮음'):'수신 대기';
  const fill=document.getElementById(`yolo-conf-fill-${id}`);if(fill){fill.style.width=state.confidenceKnown?Math.round(topVal)+'%':'0%';fill.style.background=topVal>=70?meta.color:'#9A5E00';}
  const history=state.history||[];const counts={Left:0,Right:0,Supine:0};history.slice(-5).forEach(h=>{if(counts[h]!==undefined)counts[h]++;});
  const majority=Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0]||topKey;const majMeta=yoloMeta(majority);
  set('m-majority',majMeta.label);set('m-votes',`${counts[majority]||0} / ${Math.min(history.length,5)} votes`);
  const majEl=document.getElementById(`yolo-m-majority-${id}`);if(majEl)majEl.style.color=majMeta.textColor;
}
function renderYoloHist(id){
  const state=YOLO_PANEL_STATE[id];const bars=document.getElementById(`yolo-hist-bars-${id}`);const labels=document.getElementById(`yolo-hist-labels-${id}`);if(!state||!bars||!labels)return;
  const history=(state.history||[]).slice(-5);const color={Left:'#378ADD',Right:'#639922',Supine:'#BA7517'};
  bars.innerHTML=history.map((h,i)=>{const isLast=i===history.length-1;return`<div class="yolo-hist-bar" style="background:${color[h]||'#9B9A93'};height:${isLast?48:28}px;opacity:${0.4+0.06*i};outline:${isLast?'2px solid '+(color[h]||'#9B9A93'):'none'};outline-offset:1px"></div>`;}).join('');
  labels.innerHTML=history.map((_,i)=>{const sec=(i-history.length+1);return`<div class="yolo-hist-lbl">${sec===0?'지금':sec+'s'}</div>`;}).join('');
}
function syncYoloSliders(id){return;}
function renderYoloPanel(id){renderYoloClsRows(id);renderYoloMetrics(id);renderYoloHist(id);syncYoloSliders(id);}
function applyYoloSlider(id){
  if(!YOLO_PANEL_STATE[id])return;
  const raw={};YOLO_POSTURES.forEach(p=>{const el=document.getElementById(`yolo-sl-${p.key.toLowerCase()}-${id}`);raw[p.key]=el?Number(el.value):0;});
  YOLO_PANEL_STATE[id].probs=normalizeYoloProbabilities(raw)||raw;
  YOLO_PANEL_STATE[id].confidenceKnown=true;
  const [topKey]=topYoloClass(YOLO_PANEL_STATE[id].probs);
  pushYoloHistory(id,topKey,false);renderYoloPanel(id);
}
function pushYoloHistory(id,posture,rerender=true){
  if(!posture)return;
  if(!YOLO_PANEL_STATE[id])YOLO_PANEL_STATE[id]={probs:deriveYoloProbabilities(posture,0).probs,confidenceKnown:false,history:[]};
  YOLO_PANEL_STATE[id].history.push(posture);
  if(YOLO_PANEL_STATE[id].history.length>5)YOLO_PANEL_STATE[id].history=YOLO_PANEL_STATE[id].history.slice(-5);
  if(rerender)renderYoloPanel(id);
}
function initYoloPanel(p){
  ensureYoloState(p);
  renderYoloPanel(p.id);
}
function syncYoloPanelFromPatient(p){if(!p)return;ensureYoloState(p);renderYoloPanel(p.id);}

}

}
function buildHeatmap(hm){return(hm||[]).map(s=>`<div class="hm-cell" style="background:${postureFill(s.p,Math.min(s.m/120,1))}" title="${PLABELS[s.p]||s.p} ${s.m}분"></div>`).join('');}

function buildSummaryTimelineCells(p){
  // postureSummaryTimeline은 백엔드에서 전체 갱신 시 최근 5초 동안 가장 많이 나온 대표 체위를 1개씩 추가한 배열이다.
  const src=(p.postureSummaryTimeline&&p.postureSummaryTimeline.length>0)
    ?p.postureSummaryTimeline.slice(-6).map(x=>({p:x.p}))
    :(p.heatmap||[]).slice(-6).map(x=>({p:x.p}));

  return src.map((item,i,arr)=>{
    const isLast=i===arr.length-1;
    const cls=(item.p||'Supine').toLowerCase();
    const timeLabel=isLast?'현재':`-${(arr.length-1-i)*15}초`;
    return `<div class="tl-cell"><div><span class="tl-chip ${cls}">${PLABELS[item.p]||item.p}</span></div><div class="tl-line-row"><div class="${isLast?'tl-dot active':'tl-dot'}"></div><div class="${isLast?'tl-seg danger':'tl-seg'}"></div></div><div class="tl-time">${timeLabel}</div></div>`;
  }).join('');
}

function updateDetailSummaryFromPatient(p){
  if(!p || currentDetailId!==p.id)return;

  const timelineEl=document.getElementById(`summary-timeline-${p.id}`);

  const elapsedEl=document.getElementById(`detail-elapsed-${p.id}`);

  const scoreEl=document.getElementById(`detail-risk-score-${p.id}`);

  const riskSubEl=document.getElementById(`detail-risk-sub-${p.id}`);

  document.getElementById('cnt-caution').textContent=data.filter(p=>p.status==='caution').length+'명';

  document.getElementById('ward-label').textContent=`3병동 · 총 ${data.length}명`;
  data.forEach(p=>{
    const col=acol(p.status),nxtCls=p.status==='immediate'?'next-urg':'next-ok';
    const isOver=p.elapsedMinutes>p.maxAllowedMinutes;
    const remaining=p.maxAllowedMinutes-p.elapsedMinutes;
    const hmLen=(p.heatmap||[]).length;
    const actionCls=p.status==='immediate'?'urgent':p.status==='caution'?'caution':'';
    const card=document.createElement('div');card.className=`p-card ${p.status}`;
    card.innerHTML=`
      <div class="p-card-header" onclick="toggleInline('${p.id}')">
        <div class="rank-badge ${col}">${p.priority}</div>
        <div class="p-info"><div class="p-name">${p.name}</div><div class="p-meta">${p.room} · ${p.age}세 · ${p.gender}</div></div>
        <span class="status-pill ${col}">${riskLabel(p)}</span>
        <div class="posture-flow">
          <span class="p-chip" id="list-current-${p.id}">${PLABELS[p.currentPosition]||p.currentPosition}</span>
          <span class="arrow-icon">→</span>
          <span class="p-chip ${nxtCls}">${PLABELS[p.recommendedPosition]||p.recommendedPosition}</span>
        </div>
        <span class="score-badge ${col}" title="Braden 점수">${bradenScoreText(p)}</span>
        <button class="detail-btn" onclick="event.stopPropagation();openDetail('${p.id}')">상세 →</button>
      </div>
      <div class="risk-bar-track"><div class="risk-bar-fill" style="width:${bradenRiskPct(p)}%;background:${barcol(p.status)}"></div></div>
      <div class="inline-panel" id="inline-${p.id}" style="display:${openPanels.has(p.id)?'block':'none'}">
        <div class="hm-label"><span>자세 경과 히트맵 · ${hmLen}구간</span><span style="font-family:var(--mono)">${elapsed2str(p.elapsedMinutes)} 경과 · ${isOver?Math.abs(remaining)+'분 초과 ⚠':remaining+'분 남음'}</span></div>
        <div class="hm-grid">${buildHeatmap(p.heatmap||[])}</div>
        <div class="hm-legend">
          <div class="hm-leg-item"><div class="hm-leg-swatch" style="background:linear-gradient(to right,#E6F1FB,#185FA5)"></div>좌측위</div>
          <div class="hm-leg-item"><div class="hm-leg-swatch" style="background:linear-gradient(to right,#EAF3DE,#3B6D11)"></div>우측위</div>
          <div class="hm-leg-item"><div class="hm-leg-swatch" style="background:linear-gradient(to right,#FAEEDA,#854F0B)"></div>앙와위</div>
          <span style="font-size:10px;color:var(--txt-tertiary)">연함→진함: 0→120분</span>
        </div>
        <div class="inline-grid">
          <div class="ig-item">현재 체위<div class="ig-val">${PLABELS[p.currentPosition]||p.currentPosition}</div></div>
          <div class="ig-item">권장 행동<div class="ig-val">${p.recommendedAction}</div></div>
          <div class="ig-item">Braden 점수<div class="ig-val">${bradenScoreText(p)}점 · ${riskLabel(p)}</div></div>
          <div class="ig-item">진단<div class="ig-val" style="font-size:11px">${p.diagnosis}</div></div>
        </div>
        <div class="action-box ${actionCls}">${p.status==='immediate'?'🚨':p.status==='caution'?'⚠️':'✅'} <strong>${p.recommendedAction}</strong></div>
      </div>`;
    c.appendChild(card);
  });
}

function openDetail(id){
  currentDetailId=id;
  const p=patients.find(x=>x.id===id);if(!p)return;
  if(radarChart){radarChart.destroy();radarChart=null;}
  document.getElementById('list-view').style.display='none';
  document.getElementById('detail-view').style.display='block';
  document.getElementById('detail-nav-title').textContent=p.name+' · '+p.room;
  const isOver=p.elapsedMinutes>p.maxAllowedMinutes;
  const scoreCol=scoreClass(p);
  const bradenFactors=getBradenChartItems(p);
  const factorRows=bradenFactors.map(item=>`
    <div class="factor-row">
      <span class="factor-name">${item.label}</span>
      <div class="factor-track"><div class="factor-fill" title="${item.label} ${bradenItemScoreText(item)}" style="width:${item.risk}%;background:${fcolor(item.risk)}"></div></div>
      <span class="factor-score" style="color:${fcolor(item.risk)}">${bradenItemScoreText(item)}</span>
    </div>`).join('');
  const tlCells=buildSummaryTimelineCells(p);
  const highSpots=Object.entries(p.spotRisks||{}).filter(([,v])=>v>=70).map(([k])=>BODY_SPOTS[k]?BODY_SPOTS[k].label:k);
  const spotListHtml=highSpots.length?highSpots.map(s=>`<div class="bleg-spot"><div class="bleg-spot-dot"></div>${s}</div>`).join(''):`<div style="font-size:11px;color:var(--txt-tertiary)">고위험 부위 없음</div>`;
  const alertBox=p.status==='immediate'
    ?`<div class="alert-box danger"><span class="alert-icon">🚨</span><div><strong>즉시 조치 필요</strong><br>Braden Scale ${bradenScoreText(p)}점(${riskLabel(p)}) 기준으로 욕창 위험이 높습니다.<br><strong>권장: ${p.recommendedAction}</strong></div></div>`
    :p.status==='caution'
    ?`<div class="alert-box warn"><span class="alert-icon">⚠️</span><div><strong>주의 관찰 필요</strong><br>Braden Scale ${bradenScoreText(p)}점(${riskLabel(p)}) · ${p.recommendedAction}</div></div>`:'';
  document.getElementById('dp-content').innerHTML=`
    <div class="dp-header">
      <div class="dp-hrow">
        <div class="dp-avatar">👤</div>
        <div><div class="dp-name">${p.name}</div><div class="dp-sub">${p.room} · ${p.age}세 · ${p.gender}<br><span>진단:</span> ${p.diagnosis} &nbsp;·&nbsp; <span>Braden:</span> ${bradenScoreText(p)}점</div></div>
        <span class="status-pill ${acol(p.status)}" style="margin-left:auto;align-self:flex-start">${riskLabel(p)}</span>
      </div>
      <div class="dp-metrics">
        <div class="dp-metric"><div class="dp-metric-lbl">현재 체위</div><div class="dp-metric-val blue" id="detail-current-${p.id}" style="font-size:13px;font-family:var(--font)">${PLABELS[p.currentPosition]||p.currentPosition}</div></div>
        <div class="dp-metric"><div class="dp-metric-lbl">권장 체위</div><div class="dp-metric-val ok" id="detail-recommended-${p.id}" style="font-size:13px;font-family:var(--font)">${PLABELS[p.recommendedPosition]||p.recommendedPosition}</div></div>
        <div class="dp-metric"><div class="dp-metric-lbl">경과 시간</div><div class="dp-metric-val ${isOver?'danger':''}" id="detail-elapsed-${p.id}">${elapsed2str(p.elapsedMinutes)}</div><div class="dp-metric-sub">${isOver?'⚠ 초과':'정상 범위'}</div></div>
        <div class="dp-metric"><div class="dp-metric-lbl">Braden 점수</div><div class="dp-metric-val ${scoreCol}" id="detail-risk-score-${p.id}">${bradenScoreText(p)}</div><div class="dp-metric-sub" id="detail-risk-sub-${p.id}">${riskLabel(p)}</div></div>
      </div>
      ${alertBox}
    </div>
    <div class="detail-tabs" role="tablist" aria-label="환자 상세 정보 탭">
      <button class="detail-tab-btn active" id="risk-tab-btn-${p.id}" type="button" role="tab" aria-selected="true" aria-controls="risk-tab-${p.id}" onclick="switchDetailTab('${p.id}','risk')">위험 분석</button>
      <button class="detail-tab-btn" id="yolo-tab-btn-${p.id}" type="button" role="tab" aria-selected="false" aria-controls="yolo-tab-${p.id}" onclick="switchDetailTab('${p.id}','yolo')">YOLO 체위 분류</button>
    </div>
    <section class="detail-tab-panel active" id="risk-tab-${p.id}" role="tabpanel" aria-labelledby="risk-tab-btn-${p.id}">
      <div class="dp-two-col">
        <div class="dp-section"><div class="dp-sec-title">Braden 하위척도 레이더</div><div style="position:relative;height:180px"><canvas id="radar-chart"></canvas></div></div>
        <div class="dp-section"><div class="dp-sec-title">Braden 하위척도</div>${factorRows}<div class="factor-legend"><span><b style="color:#2D6A2D">■</b> 낮은 위험</span><span><b style="color:#9A5E00">■</b> 주의</span><span><b style="color:#C0392B">■</b> 높은 위험</span></div><div style="font-size:10px;color:var(--txt-tertiary);margin-top:6px">막대는 Braden 점수를 0–100 위험도로 역변환한 값입니다. 점수가 낮을수록 길어집니다.</div></div>
      </div>
      <div class="dp-section"><div class="dp-sec-title">신체 부위별 압력 위험도</div><div class="body-map-row"><div class="body-map-svg">${buildBodySVG(p.spotRisks||{})}</div><div class="body-map-legend"><div class="bleg-title">위험도 범례</div><div class="bleg-item"><div class="bleg-dot" style="background:rgba(192,57,43,.4);border:1.5px solid #C0392B"></div>고위험</div><div class="bleg-item"><div class="bleg-dot" style="background:rgba(154,94,0,.35);border:1.5px solid #9A5E00"></div>주의</div><div class="bleg-item"><div class="bleg-dot" style="background:rgba(45,106,45,.3);border:1.5px solid #2D6A2D"></div>안전</div><div class="bleg-spots-title">주요 고위험</div>${spotListHtml}</div></div></div>
      <div class="dp-section"><div class="dp-sec-title">최근 체위 변화 타임라인 <span style="font-size:10px;color:var(--txt-tertiary);font-weight:500">· 5초 대표 체위</span></div><div class="tl-wrap"><div class="tl-row" id="summary-timeline-${p.id}">${tlCells}</div></div></div>
    </section>
    <section class="detail-tab-panel" id="yolo-tab-${p.id}" role="tabpanel" aria-labelledby="yolo-tab-btn-${p.id}">
      ${buildYoloPanel(p)}
    </section>`;

  initYoloPanel(p);

  requestAnimationFrame(()=>{
    const ctx=document.getElementById('radar-chart');if(!ctx)return;
    const chartItems=getBradenChartItems(p);
    radarChart=new Chart(ctx,{type:'radar',data:{labels:chartItems.map(item=>item.label),datasets:[{label:'Braden 하위척도 위험도',data:chartItems.map(item=>item.risk),backgroundColor:'rgba(192,57,43,.12)',borderColor:'#C0392B',borderWidth:1.5,pointBackgroundColor:'#C0392B',pointRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:(ctx)=>`${ctx.dataset.label}: ${Math.round(ctx.parsed.r)}% · ${bradenItemScoreText(chartItems[ctx.dataIndex])}`}}},scales:{r:{min:0,max:100,ticks:{stepSize:25,font:{size:9},color:'#9B9A93'},pointLabels:{font:{size:9},color:'#6B6960'},grid:{color:'rgba(0,0,0,.07)'},angleLines:{color:'rgba(0,0,0,.07)'}}}}});
  });
}

function closeDetail(){
  currentDetailId=null;
  if(radarChart){radarChart.destroy();radarChart=null;}
  document.getElementById('detail-view').style.display='none';
  document.getElementById('list-view').style.display='block';
}


function applyRealtimePosture(data){
  const p=patients.find(x=>x.id===data.id);
  if(!p)return;

  p.currentPosition=data.currentPosition;
  p.postureConfidence=data.postureConfidence;
  if(data.postureProbabilities)p.postureProbabilities=data.postureProbabilities;
  if(data.postureVoteCount5s!==undefined)p.postureVoteCount5s=data.postureVoteCount5s;
  else if(data.postureVoteCount10s!==undefined)p.postureVoteCount5s=data.postureVoteCount10s;
  if(data.videoUrl)p.videoUrl=data.videoUrl;

  ensureYoloState(p);
  pushYoloHistory(data.id,data.currentPosition,false);

  const label=PLABELS[data.currentPosition]||data.currentPosition;

  const listCurrent=document.getElementById(`list-current-${data.id}`);
  if(listCurrent)listCurrent.textContent=label;

  const detailCurrent=document.getElementById(`detail-current-${data.id}`);
  if(detailCurrent)detailCurrent.textContent=label;

  const videoPosture=document.getElementById(`video-posture-${data.id}`);
  if(videoPosture)videoPosture.textContent=`YOLO 분류 · ${label}`;

  const videoConfidence=document.getElementById(`video-confidence-${data.id}`);
  if(videoConfidence)videoConfidence.textContent=`분류 신뢰도: ${confStr(data.postureConfidence)}`;

  renderYoloPanel(data.id);
}

async function fetchRealtimePostures(){
  const targets=patients.filter(p=>p.videoFile||p.videoUrl);
  if(targets.length===0)return;

  for(const p of targets){
    try{
      let url=`/api/posture/${encodeURIComponent(p.id)}`;

      // 상세 페이지에서 실제 영상이 재생 중이면,
      // 화면에 보이는 영상 시간(video.currentTime)을 백엔드로 전달한다.
      // 그러면 YOLO가 실제 현재 프레임 기준으로 체위를 분류한다.
      const videoEl=document.getElementById(`patient-video-${p.id}`);
      if(videoEl && !Number.isNaN(videoEl.currentTime)){
        url += `?t=${encodeURIComponent(videoEl.currentTime)}`;
      }

      const res=await fetch(url);
      if(!res.ok)continue;
      const data=await res.json();
      applyRealtimePosture(data);
    }catch(e){
      console.warn('실시간 체위 분류 실패:',p.id,e);
    }
  }
}

async function fetchAndRender(){
  const dot=document.getElementById('refresh-dot');dot.classList.add('loading');
  try{
    const res=await fetch('/api/patients');const data=await res.json();
    patients=data;renderList(patients);

    if(currentDetailId){
      const currentPatient=patients.find(x=>x.id===currentDetailId);
      updateDetailSummaryFromPatient(currentPatient);
    }

    // 상세 페이지가 열려 있을 때 openDetail()을 다시 호출하면
    // video 태그가 새로 생성되어 영상이 처음부터 재생된다.
    // 따라서 15초 갱신 시에는 상세 페이지를 다시 그리지 않고,
    // 기존 video 요소는 그대로 유지한다.
    // 목록으로 돌아갔다가 다시 상세로 들어가면 최신 patients 데이터로 다시 렌더링된다.

    document.getElementById('refresh-time').textContent=nowStr()+' 갱신';
    dot.classList.remove('loading');
  }catch(e){
    console.error('데이터 로딩 실패:',e);
    document.getElementById('patient-list').innerHTML='<div style="padding:20px;text-align:center;color:var(--txt-tertiary)">데이터를 불러올 수 없습니다.</div>';
    dot.classList.remove('loading');
  }
}
fetchAndRender();
setInterval(fetchAndRender,15000);
setInterval(fetchRealtimePostures,1000);
</script>
</body>
